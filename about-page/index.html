<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Cade Li</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://fonts.googleapis.com/css?family=Rubik:300,500,700" rel="stylesheet"/>
    <style>
        body {
            position: relative;
            margin: 0;
            color: #121314;
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: calc(10px + 0.33vw);
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }

        ::-webkit-scrollbar-thumb {
            min-height: 28px;
            background-color: #c2c2c2 !important;
            background-clip: padding-box;
            border-radius: 0 !important
        }

        ::-webkit-scrollbar-track-piece {
            background-color: #fff
        }

        .main {
            padding: 5vh 10vw;
            /*min-height: 100vh;*/
        }

        .main .main-title {
            font-size: 2.2em;
            font-weight: 500;
        }

        .main h1 {
            margin-bottom: 0;
            font-size: 4.5em;
            font-weight: 500;
        }

        .main p {
            max-width: 28em;
            line-height: 1.4;
            font-size: 1.6em;
            font-weight: 300;
        }

        .main a {
            position: relative;
            color: #121314;
            text-decoration: none;
        }

        .main a:after {
            content: '';
            position: absolute;
            z-index: -1;
            top: 60%;
            right: -0.1em;
            bottom: 0;
            left: -0.1em;
            background-color: rgba(79, 192, 141, 0.5);
            transition: top 200ms cubic-bezier(0, 0.8, 0.13, 1);
        }

        .main a:hover:after {
            top: 0;
        }
    </style>
</head>
<body>
<div class="main">
    <h1>Hi there 👋</h1>
    <p class="main-title">My name is Cade Li.</p>
    <p> 💻 I am a software developer and working on Java and JavaScript web development.</p>
    <p>
        📝 I’m currently learning and sharing on
        <a href="https://juejin.cn/user/562546315637662" target="_blank">稀土掘金</a>
        and
        <a href="https://github.com/cadecode" target="_blank">github</a>.
        You can also find me on
        <a href="https://blog.cadecode.top" target="_blank">my blog</a>.
        welcome ~
    </p>
    <p> 😸 Outside of programming, I enjoy video games, movies and reading. </p>
    <p> 🙏 Best wishes. </p>
</div>
</body>
</html>
